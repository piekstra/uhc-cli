name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every push and pull request runs on ubuntu only, a free GitHub-hosted
# runner for this public repository. The suite reads no keychain, so macOS
# would exercise nothing more; the darwin builds run on a release tag.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # libdbus: the keyring crate's Linux backend, through pk-cli-auth.
      # poppler-utils: pdftotext, which the end-to-end tests and smoke read
      # the synthetic statement PDFs with.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config poppler-utils

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: smoke
        run: make smoke

  security:
    runs-on: ubuntu-latest
    # gitleaks-action reads the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
