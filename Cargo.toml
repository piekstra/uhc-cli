[package]
name = "uhc-cli"
description = "Unofficial read-only CLI for UnitedHealthcare coverage, claims, EOBs and deductible progress (health-records/v1)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/uhc-cli"
homepage = "https://github.com/piekstra/uhc-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "uhc"
path = "src/lib.rs"

[[bin]]
name = "uhc"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
